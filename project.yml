name: MealTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MealTracker:
    type: application
    platform: iOS
    sources: [MealTracker]
    info:
      path: MealTracker/Info.plist
      properties:
        CFBundleDisplayName: Meal Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Meal Tracker reads your active calories burned so it can raise your daily calorie and macro targets on days you exercise.
        NSHealthUpdateUsageDescription: Meal Tracker does not write to Apple Health.
    entitlements:
      path: MealTracker/MealTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mealtracker
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [MealTrackerTests]
  MealTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MealTrackerTests]
    dependencies:
      - target: MealTracker
